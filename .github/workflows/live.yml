# Refreshes the "Lately" block of the profile README once a day (scripts/live.mjs).
# Public data only (shivumat.me RSS, npm downloads API); no secrets.
name: live

on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency: live

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node scripts/live.mjs
      - name: Commit if the block changed
        run: |
          if git diff --quiet README.md; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Lately: daily refresh"
          git push
